<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intent &amp; outcome · Playlab Chatlog Analyzer</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="page-label-analysis">
  <div class="shell">
    <header class="topbar">
      <div class="topbar-row topbar-row-primary">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <div class="brand-title">Playlab Chatlog Analyzer</div>
          </div>
        </div>
        <nav class="view-tabs" aria-label="Views">
          <a class="view-tab" href="/">Browser</a>
          <a class="view-tab" href="/cost_analysis">Cost analysis</a>
          <a class="view-tab active" href="/label_analysis" aria-current="page">Intent &amp; outcome</a>
          <a class="view-tab" href="/testing_behavior">Testing behavior</a>
        </nav>
      </div>

      <div class="topbar-row la-toolbar">
        <div class="la-control">
          <label for="laEditor">Coder</label>
          <select id="laEditor">
            <option value="all">All coders</option>
            <option value="ruiwei">ruiwei</option>
            <option value="jiayi">jiayi</option>
          </select>
        </div>
        <div class="la-control">
          <label for="laApp">App</label>
          <select id="laApp">
            <option value="All">All apps</option>
          </select>
        </div>
        <label class="la-check">
          <input type="checkbox" id="laSampleOnly" />
          <span>Sample set only</span>
        </label>
        <label class="la-check">
          <input type="checkbox" id="laBuilderOnly" />
          <span>Builders only</span>
        </label>
        <button type="button" class="la-refresh" id="laRefresh">Refresh</button>
      </div>
    </header>

    <div class="workspace la-page">
      <section class="la-body" id="laBody">
        <div class="empty">Loading coded messages…</div>
      </section>
    </div>
  </div>

  <script src="/label_analysis.js"></script>
</body>
</html>
