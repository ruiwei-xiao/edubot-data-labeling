<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlab Browser</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-row topbar-row-primary">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <div class="brand-title">Playlab Browser</div>
            <div class="brand-sub" id="totalCount">Loading…</div>
          </div>
        </div>
      </div>

      <div class="topbar-row topbar-row-controls">
        <section class="control-panel filters-panel">
          <div class="panel-label">Filters</div>
          <div class="filters">
            <div class="filter">
              <span>Apps</span>
              <div class="count-select" id="appSelectWrap" data-name="app">
                <button type="button" class="count-select-trigger" id="appSelectTrigger">
                  <span class="count-select-label">All</span>
                  <span class="count-select-count" id="appSelectCount"></span>
                </button>
                <div class="count-select-menu" id="appSelectMenu" hidden></div>
                <input type="hidden" id="appSelect" value="All" />
              </div>
            </div>
            <div class="filter">
              <span>Users</span>
              <div class="count-select" id="userSelectWrap" data-name="user">
                <button type="button" class="count-select-trigger" id="userSelectTrigger">
                  <span class="count-select-label">All</span>
                  <span class="count-select-count" id="userSelectCount"></span>
                </button>
                <div class="count-select-menu" id="userSelectMenu" hidden></div>
                <input type="hidden" id="userSelect" value="All" />
              </div>
            </div>
            <label class="filter filter-search">
              <span>Search</span>
              <input id="searchInput" type="search" placeholder="Search conversations…" />
            </label>
          </div>
        </section>

        <section class="control-panel shortcuts-panel" id="shortcutsBar">
          <div class="panel-label">Shortcuts</div>
          <div class="shortcut-actions">
            <button id="groupByBotBtn" class="chip-btn" type="button" title="Grid map: one column per bot">Group by bot</button>
            <button id="needsAttentionBtn" class="chip-btn" type="button" title="Only flagged conversations">Needs attention</button>
          </div>
        </section>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div id="listCount" class="list-count">0 items</div>
        </div>
        <div id="itemList" class="activity-list">
          <div class="empty">Loading…</div>
        </div>
      </aside>

      <section class="bot-map" id="botMapView" hidden>
        <div class="bot-map-toolbar">
          <div id="botMapCount" class="list-count">0 bots</div>
          <div class="bot-map-legend" role="group" aria-label="Audience filters">
            <button type="button" class="legend-item legend-builder active" data-audience="builder" title="Show/hide Builder tests">Builder tests</button>
            <button type="button" class="legend-item legend-anonymous active" data-audience="anonymous" title="Show/hide Anonymous">Anonymous</button>
            <button type="button" class="legend-item legend-other active" data-audience="other" title="Show/hide Other users">Other users</button>
          </div>
        </div>
        <div class="bot-map-grid" id="botMapGrid"></div>
      </section>

      <div class="split-handle" id="splitHandle" hidden title="Drag to resize"></div>

      <main class="detail" id="detailPane">
        <div class="empty-detail">
          <h2>Select an item</h2>
          <p>Filter by teacher or app, then pick from the list.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
